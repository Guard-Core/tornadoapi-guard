name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  ci-gate:
    # Same workflow file as the PR CI (python matrix, coverage gate): the release never runs a weaker gate.
    # A called workflow's jobs report as "ci-gate / <job>", so none of them can be mistaken for the required `ci` check.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Packaging only (the wheel is pure Python); the matrix gate is the ci-gate job above.
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked --only-group release --no-install-project

      - name: Build package
        run: |
          uv run --no-sync python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
