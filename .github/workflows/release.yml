name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  ci-gate:
    # Same workflow file as the PR CI (python matrix, coverage gate): the release never runs a weaker gate.
    # A called workflow's jobs report as "ci-gate / <job>", so none of them can be mistaken for the required `ci` check.
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/ci.yml
    secrets:
      IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}

  cve-scan:
    # The release never runs a weaker gate than a pull request (spec 14.3b); on a release event the SBOM is attached to the release.
    permissions:
      contents: write # attach the SBOM to the release
      security-events: write # SARIF
    uses: Guard-Core/.github/.github/workflows/cve-scan.yml@b3f52dbfccdfff9395efbc0c05f558610ca97546 # cve-scan (merged commit)
    with:
      tools_ref: b3f52dbfccdfff9395efbc0c05f558610ca97546
      release_tag: ${{ github.event.release.tag_name }}

  publish:
    needs: [ci-gate, cve-scan]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.10'
      UV_PYTHON_DOWNLOADS: never
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Packaging only (the wheel is pure Python); the matrix gate is the ci-gate job above.
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv==0.13.4
          uv sync --locked --only-group release --no-install-project

      - name: Build package
        run: |
          uv run --no-sync python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
