name: Live Smoke

on:
  push:
    branches:
      - master
    paths:
      - 'tornadoapi_guard/**'
      - 'examples/**'
      - '.github/workflows/live-smoke.yml'
  pull_request:
    paths:
      - 'tornadoapi_guard/**'
      - 'examples/**'
      - '.github/workflows/live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Dockerized smoke run (simple_app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_SMOKE_PROJECT: tornadoapi-guard-live-smoke

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv

      - name: Build the tornadoapi-guard wheel from this checkout
        run: |
          uv build --wheel --out-dir examples/live_smoke_wheels

      - name: Stage the example app with the checkout wheel
        run: |
          rm -rf live_smoke_stack
          cp -r examples/simple_app live_smoke_stack
          wheel=$(ls examples/live_smoke_wheels/tornadoapi_guard-*.whl | head -n 1)
          cp "$wheel" live_smoke_stack/
          # Install the wheel from this checkout instead of the PyPI release;
          # the wheel must be COPYed into the image before pip runs
          python3 - <<'EOF'
          import pathlib
          req = pathlib.Path("live_smoke_stack/requirements.txt")
          lines = [line for line in req.read_text().splitlines() if not line.startswith("tornadoapi-guard")]
          lines.append("tornadoapi-guard @ file:///app/tornadoapi_guard-wheel.whl")
          req.write_text("\n".join(lines) + "\n")
          wheel_dir = pathlib.Path("live_smoke_stack")
          wheel = next(wheel_dir.glob("tornadoapi_guard-*.whl"))
          wheel.rename(wheel_dir / "tornadoapi_guard-wheel.whl")
          dockerfile = pathlib.Path("live_smoke_stack/Dockerfile")
          df = dockerfile.read_text()
          anchor = "COPY requirements.txt /app/"
          assert anchor in df
          df = df.replace(
              anchor,
              anchor + "\nCOPY tornadoapi_guard-wheel.whl /app/",
          )
          dockerfile.write_text(df)
          EOF

      - name: Bring the smoke stack up
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml up --build -d --wait

      - name: Run smoke assertions
        run: |
          set -euo pipefail
          base="http://localhost:8000"

          check() {
            local name="$1" expected="$2"; shift 2
            local status
            status=$(curl -sS --max-time 10 -o /tmp/smoke_body -w '%{http_code}' "$@") || {
              echo "FAIL: $name (curl error)"; exit 1
            }
            if [ "$status" != "$expected" ]; then
              echo "FAIL: $name (expected $expected, got $status)"; cat /tmp/smoke_body; exit 1
            fi
            echo "ok: $name -> $status"
          }

          check "GET / serves" 200 "$base/"
          check "GET /basic/health serves" 200 "$base/basic/health"
          # The guard's custom_request_check blocks debug=true with a 403 body
          check "GET /?debug=true blocked by custom check" 403 "$base/?debug=true"

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml logs --no-color

      - name: Bring the smoke stack down
        if: always()
        run: |
          docker compose -p "$LIVE_SMOKE_PROJECT" -f live_smoke_stack/docker-compose.yml down -v --remove-orphans
