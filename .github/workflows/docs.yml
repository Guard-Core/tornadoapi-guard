name: Docs Update
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/SKILL.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          # Pinned on purpose (LEDGER 6.69): the docs build does not depend on the interpreter and 3.14 is the version the mkdocstrings setup was verified on; the test matrix in ci.yml owns every supported version.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --locked --python 3.14 --extra dev --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Lint documentation
        run: |
          uv run --no-sync pymarkdownlnt scan -r -e ./.venv -e ./.git -e ./.github -e ./data -e ./tornadoapi_guard -e ./tests .

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Deploy documentation
        run: |
          uv run --no-sync mike deploy --push latest
          uv run --no-sync mike set-default --push latest

      - name: Deploy to GitHub Pages
        run: |
          uv run --no-sync mike list
          git push origin gh-pages --force
