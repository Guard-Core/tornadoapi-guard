name: Docs Update
on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/SKILL.md'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Pinned on purpose (LEDGER 6.69): the docs build does not depend on the interpreter and 3.14 is the version the mkdocstrings setup was verified on; the test matrix in ci.yml owns every supported version.
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install uv==0.13.4
          uv sync --locked --python 3.14 --extra dev --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Lint documentation
        run: |
          uv run --no-sync pymarkdownlnt scan -r -e ./.venv -e ./.git -e ./.github -e ./data -e ./tornadoapi_guard -e ./tests .

      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Let git push use the job token (the checkout keeps no credentials)
        run: git config --local credential.helper "!f() { echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"

      - name: Deploy documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync mike deploy --push latest
          uv run --no-sync mike set-default --push latest

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync mike list
          git push origin gh-pages --force
