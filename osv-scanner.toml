id = "CVE-2026-115927"
ignoreUntil = 2026-12-15
reason = "GHSA-r4j5-9xpp-3985, event-loop blocking and memory from chunked bodies with many small chunks. It DOES reach users on Python 3.10: tornado reads the chunks before the handler's prepare runs (for a stream_request_body handler, prepare runs at the headers, untested whether a refusal there stops the reading). Bound: tornado's max_body_size server setting (default 100 MB). tornado 6.5.10 is the Python 3.10 fork of the lock: the fixed tornado 6.6 requires Python >= 3.11 and this project declares >= 3.10, so no fixed release exists for 3.10 (the lock resolves 6.6 on 3.11 and later). Checked 2026-11-02: PyPI has no 6.5.x release after 6.5.10, upstream branch6.5 equals v6.5.10 and each advisory lists 6.6.0 as its only patched version; Python 3.10 stays supported, so remove this entry when a fixed 3.10 release exists. Release notes name the advisory and advise Python 3.11+ (D-257). At ignoreUntil, repeat the PyPI and OSV reads and extend the date with that evidence while 3.10 has no fix."

