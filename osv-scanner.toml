# Per-advisory suppressions read by the CVE gate (.github/workflows/cve-scan.yml, Guard-Core/.github cve-scan/cve_scan.py).
# Every entry names one advisory, states why it does not reach users (or, when no fixed release exists for a supported Python, says that it
# does reach those users, how, and what bounds it, D-257) and carries an ignoreUntil date. An expired entry fails the gate,
# an entry that matches nothing fails the gate, and an OSV MAL-* entry can never be listed. Delete the entry when the blocker is gone.

[[IgnoredVulns]]
id = "CVE-2026-116577"
ignoreUntil = 2026-12-15
reason = "GHSA-pcg2-g6cj-q92c, quadratic CPU when parsing folded HTTP header lines. It DOES reach users on Python 3.10: tornado parses the headers in its HTTP/1 connection before any handler code runs, so the adapter (hooks prepare and _execute) cannot see or stop it. Bound: tornado's max_header_size server setting (default 65536). tornado 6.5.10 is the Python 3.10 fork of the lock: the fixed tornado 6.6 requires Python >= 3.11 and this project declares >= 3.10, so no fixed release exists for 3.10 (the lock resolves 6.6 on 3.11 and later). Checked 2026-11-02: PyPI has no 6.5.x release after 6.5.10, upstream branch6.5 equals v6.5.10 and each advisory lists 6.6.0 as its only patched version; Python 3.10 stays supported, so remove this entry when a fixed 3.10 release exists. Release notes name the advisory and advise Python 3.11+ (D-257). At ignoreUntil, repeat the PyPI and OSV reads and extend the date with that evidence while 3.10 has no fix."

