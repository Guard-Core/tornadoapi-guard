services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  app:
    build:
      context: ../..
      dockerfile: examples/advanced_app/Dockerfile
    image: tornadoapi-guard-advanced-app:local
    expose:
      - "8000"
    environment:
      # Trust only the compose network for forwarded headers (nginx hop).
      - TRUSTED_PROXIES=172.16.0.0/12,10.0.0.0/8
      - REDIS_URL=redis://redis:6379
      - REDIS_PREFIX=${REDIS_PREFIX:-tornadoapi_guard:}
      - IPINFO_TOKEN=${IPINFO_TOKEN:-test_token}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-admin-token-change-me}
      - RATE_LIMIT=${RATE_LIMIT:-30}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - AUTO_BAN_THRESHOLD=${AUTO_BAN_THRESHOLD:-5}
      - AUTO_BAN_DURATION=${AUTO_BAN_DURATION:-300}
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      # wget --spider issues HEAD, which Tornado handlers reject with 405
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

volumes:
  redis-data:
